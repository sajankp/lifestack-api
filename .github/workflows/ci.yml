name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  COVERAGE_THRESHOLD: 80

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          # Pinned explicitly rather than via `python-version-file`.
          # `requires-python = ">=3.13"` lets setup-python pick the newest
          # interpreter on the runner image, which drifted to 3.15 and broke
          # the build: fastmcp 3.4.5 only declares support up to 3.13, so
          # `from fastmcp import FastMCP` raised ImportError and pytest exited 4.
          # The Dockerfile already pins python:3.13-slim, so CI now matches it.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pre-commit checks
        run: |
          uv run pre-commit run --all-files

      - name: Dependency audit
        run: |
          uv run --with pip-audit pip-audit --progress-spinner off

      - name: Run tests with coverage
        run: |
          echo "TESTING=true" > .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/lifestack_ci" >> .env
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "PASSWORD_ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_SECONDS=1800" >> .env
          echo "REFRESH_TOKEN_EXPIRE_SECONDS=3600" >> .env

          uv run pytest --durations=25 --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Security scanning
        run: |
          uv run --with bandit bandit -r app/ -ll --format json --output bandit-report.json

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          extra_args: --results=verified

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          if-no-files-found: warn
          retention-days: 30

  trigger-e2e:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # paths-filter inspects the git history, so the repository has to be
      # checked out in this job. On a push it diffs the event's `before` SHA
      # against the new head, so both must be present locally -- a full
      # fetch is used because the repo is small (~15MB) and it removes any
      # shallow-clone ambiguity around merge commits.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only dispatch the E2E suite when this merge can actually change what
      # the suite sees. The E2E workflow checks out this repository and
      # rebuilds the api-e2e image from source, so a docs-only or
      # test-only change cannot affect the result -- and a full E2E run takes
      # ~1h when it is failing. dorny/paths-filter is used rather than the
      # `on.push.paths` trigger because that filter would also skip this
      # repo's own CI, which must still run on every push.
      - name: Detect runtime changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          # 'some-with-excludes' is required: with the default 'some'
          # quantifier a negated pattern matches everything, which would
          # invert this filter.
          predicate-quantifier: some-with-excludes
          # Runtime inputs of the api-e2e image: the app package, the Alembic
          # migrations, and the files that decide how the image is built.
          filters: |
            runtime:
              - 'app/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              # Test files are excluded: they run in this repo's own CI and do
              # not change the behaviour of the built image.
              - '!app/tests/**'
              - '!app/**/tests/**'

      - name: Trigger E2E pipeline
        if: steps.changes.outputs.runtime == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.E2E_DISPATCH_TOKEN }}
          repository: sajankp/lifestack-e2e
          event-type: api-web-merge
          client-payload: '{"ref": "${{ github.sha }}", "repo": "${{ github.repository }}"}'
