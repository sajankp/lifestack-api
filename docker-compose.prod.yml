services:
  api:
    # Requires Docker Compose v2.24.4+ for the !override merge tag.
    env_file: !override
      - path: .env.production
        required: true
    environment: !reset {}

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
