[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "lifestack-api"
version = "0.1.0"
description = "Personal OS — tasks, money, and investments, unified."
requires-python = ">=3.13"
dependencies = [
    # Core
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.14.2",
    # Database
    "sqlmodel>=0.0.37",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "python-multipart>=0.0.12",
    "pwdlib[argon2]>=0.2.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "prometheus-client>=0.20.0",
    "posthog>=3.7.0",
    # Scheduler
    "apscheduler>=3.11.0",
    "google-generativeai>=0.8.6",
    "websockets>=16.0",
    "httpx>=0.28.1",
    # Pin vulnerable/transitive packages to patched versions
    "cryptography>=48.0.1",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "openpyxl>=3.1.5",
    "pyjwt[crypto]>=2.10.1",
    "pdfplumber>=0.11.10",
    "pywebpush>=2.3.0",
    "httplib2>=0.32.0",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "testcontainers[postgres]>=4.9.0",
    "pre-commit>=3.5.0",
    "anyio>=4.0.0",
    "reportlab>=5.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
preview = true
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".coverage",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PLC0415", # import outside top level
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # FastAPI uses Depends() in function defaults
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning:testcontainers\\.redis",
    "ignore:`json_encoders` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi\\.extension",
    "ignore:Setting per-request cookies=.*:DeprecationWarning:httpx\\._client",
    "ignore:Pydantic serializer warnings.*:UserWarning:pydantic\\.main",
]
