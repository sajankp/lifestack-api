# Shared config for the app image (api + one-shot migrate share build/env/volumes).
x-app-base: &app-base
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lifestack:lifestack@postgres:5432/lifestack}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/1}
    MCP_ENABLED: ${MCP_ENABLED:-false}
    MCP_MOUNT_PATH: ${MCP_MOUNT_PATH:-/mcp}
    # Migrations run in the dedicated `migrate` service, not on app boot.
    RUN_MIGRATIONS: "false"
  volumes:
    - .:/app
    - /app/.venv
    - imports-temp:/app/imports_temp
    # spec-079 Stage A: bind-mounted host dir for CAPTURE_TURN_LOG_PATH so the
    # voice tool-call-turn log survives container recreation (unlike the
    # stdout-only structured logs, which don't). Unused unless that setting
    # points inside this path.
    - ./logs/capture:/app/logs/capture

services:
  # One-shot migration runner. Runs `alembic upgrade head` to completion with
  # no healthcheck/timeout, then exits. `api` waits for this via
  # service_completed_successfully, so a long migration never trips the app
  # healthcheck (and, in prod, never blocks cloudflared indefinitely).
  migrate:
    <<: *app-base
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-base
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations are decoupled (see `migrate`), so app boot is fast; this
      # window only needs to cover uvicorn startup, with margin to spare.
      start_period: 60s

  postgres:
    image: postgres:18
    profiles: ["local"]
    environment:
      POSTGRES_USER: lifestack
      POSTGRES_PASSWORD: lifestack
      POSTGRES_DB: lifestack
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifestack -d lifestack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["local"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  pg-data:
  imports-temp:
