services:
  api:
    build: .
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://lifestack:lifestack@postgres:5432/lifestack
      - REDIS_URL=redis://redis:6379/1
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lifestack
      POSTGRES_PASSWORD: lifestack
      POSTGRES_DB: lifestack
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pg-data:
