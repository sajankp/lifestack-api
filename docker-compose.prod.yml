services:
  migrate:
    # Requires Docker Compose v2.24.4+ for the !override merge tag.
    env_file: !override
      - path: .env.production
        required: true
    environment: !reset {}
    # PostgreSQL is external in production; do not inherit the base file's
    # dependency on the local-profile postgres service.
    depends_on: !override {}

  api:
    # Requires Docker Compose v2.24.4+ for the !override merge tag.
    env_file: !override
      - path: .env.production
        required: true
    # Clear the base env map (DATABASE_URL etc. come from .env.production),
    # but keep in-app migrations disabled — the `migrate` service owns them.
    environment: !override
      RUN_MIGRATIONS: "false"
    # Wait only for the dedicated migration job. PostgreSQL and Redis are
    # external services configured in .env.production and cannot be waited on
    # as Compose services.
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  cloudflared:
    # Pin to a known stable version to avoid unexpected breaking changes from 'latest'
    image: cloudflare/cloudflared:2026.6.0
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  database-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    env_file:
      - path: .env.production
        required: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/database-backup-last-success"]
      interval: 1h
      timeout: 5s
      retries: 48
      start_period: 24h
